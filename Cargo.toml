[workspace]
resolver = "2"
members = [
    "crates/warden-policy",
    "crates/warden-audit",
    "crates/warden-net",
    "crates/warden-guard",
    "crates/warden-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacksonjp0311-gif/agent-warden"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
globset = "0.4"
regex = "1"
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
signal-hook = "0.3"
ureq = "2"
tempfile = "3"
